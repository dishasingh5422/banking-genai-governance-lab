[project]
name = "banking-genai-governance-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
